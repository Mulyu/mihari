id: error-fix-pr
description: When an ERROR appears in the app log, ask Claude to fix it on a branch and open a PR
trigger:
  source: file
  path: /var/log/myapp.log
  pattern: "ERROR"
# Suppress refiring within 5 minutes; the built-in idempotency conventions
# in claude_agent handle longer-lived duplicates (existing branch / open PR).
cooldown_sec: 300

steps:
  - id: get-context
    bash: |
      tail -50 /var/log/myapp.log
    capture: true

  - id: fix-and-pr
    claude_agent:
      model: claude-opus-4-7
      prompt: |
        An error was reported in the application log:

          {{ event.line }}

        Recent context (last ~50 lines):

          {{ steps.get-context.output }}

        Find the root cause, fix it, and open a pull request describing the
        cause and the fix.
      allowed_tools:
        - Read
        - Edit
        - Write
        - Glob
        - Grep
        - "Bash(git status:*)"
        - "Bash(git diff:*)"
        - "Bash(git log:*)"
        - "Bash(git ls-remote:*)"
        - "Bash(git switch:*)"
        - "Bash(git add:*)"
        - "Bash(git commit:*)"
        - "Bash(git push:*)"
        - "Bash(gh pr list:*)"
        - "Bash(gh pr create:*)"
      permission_mode: strict
      max_turns: 40
      cwd: /home/user/myrepo
    capture: true
    timeout_sec: 1200

  - id: record
    bash: |
      printf '%s\t%s\t%s\n' \
        "{{ event.timestamp }}" \
        "${MIHARI_IDEMPOTENCY_KEY}" \
        "{{ steps.fix-and-pr.output }}" \
        >> /var/log/mihari/error-fix-pr.log
    condition: always
