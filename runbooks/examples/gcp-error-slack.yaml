id: gcp-error-slack
description: GCP Cloud Functions の ERROR ログを観測して Slack に通知

trigger:
  source: gcp_cloud_logging
  project_id: my-project
  filter: 'severity>=ERROR resource.type="cloud_function"'
  interval_sec: 60

cooldown_sec: 60

agent:
  prompt: |
    GCP Cloud Logging (project=my-project) で {{ event.severity }} レベルの log を観測:

      log:     {{ event.path }}
      resource: {{ event.resource_type }}
      ts:       {{ event.timestamp }}
      message:  {{ event.line }}

    1 行 summary を作って env $SLACK_WEBHOOK_URL に通知せよ:

      curl -fsS -X POST -H 'Content-Type: application/json' \
        --data '{"text": "..."}' "$SLACK_WEBHOOK_URL"

    深追いは不要。1 ターンで完結すること。
  allowed_tools:
    - "Bash(curl:*)"
    - "Bash(jq:*)"
  permission_mode: strict
  max_turns: 2
  timeout_sec: 60
