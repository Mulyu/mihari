extends:
  - type: github
    repo: Mulyu/okite
    ref: main
    path: monban.yml

doc:
  link:
    - path: "doc/**/*.md"
      severity: warn
    - path: "README.md"
      severity: warn
    - path: "README.ja.md"
      severity: warn
    - path: "CLAUDE.md"
      severity: warn

git:
  commit:
    message:
      subject_max_length: 80
      severity: warn
  diff:
    size:
      max_total_lines: 1500
      exclude:
        - "**/*.lock"
        - "**/package-lock.json"
        - "**/yarn.lock"
        - "**/pnpm-lock.yaml"
        - "**/__snapshots__/**"
      severity: warn
  branch_name:
    pattern: "^(main|claude/[A-Za-z0-9-]+)$"
    allowed: ["main"]
    severity: error

agent:
  instructions:
    - path: "CLAUDE.md"
      required_sections:
        - "プロジェクト概要"
        - "設計原則"
        - "ディレクトリ構造"
        - "データフロー"
        - "失敗モードと対応"
        - "主要ライブラリ"
        - "コーディング規約"
        - "やらないこと（Non-Goals）"
      severity: error
