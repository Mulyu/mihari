id: error-fix-pr
description: When an ERROR appears in the app log, ask Claude to fix it on a branch and open a PR
trigger:
  source: file
  path: /var/log/myapp.log
  pattern: "ERROR"

steps:
  - id: get-context
    bash: |
      tail -50 /var/log/myapp.log
    capture: true

  - id: fix-and-pr
    claude:
      agent: true
      model: claude-opus-4-7
      system: |
        You are a senior engineer working on the repository at the given cwd.
        Stay focused on the reported error. Make minimal, well-scoped changes.
      prompt: |
        An error was reported in the application log:

          {{ event.line }}

        Recent context (last ~50 lines):

          {{ steps.get-context.output }}

        Steps to take:
        1. Investigate the codebase to identify the root cause.
        2. Create a new branch named claude/fix-<short-description>.
        3. Apply the minimal fix and run any obvious sanity checks.
        4. Commit with a descriptive message.
        5. Push the branch.
        6. Open a pull request with a summary of the cause and the fix.

        Stop after the PR is opened. Report the PR URL in your final message.
      allowed_tools:
        - Read
        - Edit
        - Write
        - Glob
        - Grep
        - "Bash(git status)"
        - "Bash(git diff:*)"
        - "Bash(git log:*)"
        - "Bash(git switch:*)"
        - "Bash(git add:*)"
        - "Bash(git commit:*)"
        - "Bash(git push:*)"
        - "Bash(gh pr create:*)"
      permission_mode: strict
      max_turns: 40
      cwd: /home/user/myrepo
    capture: true
    timeout_sec: 1200

  - id: record
    bash: |
      printf '%s\t%s\n' "{{ event.timestamp }}" "{{ steps.fix-and-pr.output }}" \
        >> /var/log/mihari/error-fix-pr.log
    condition: always
