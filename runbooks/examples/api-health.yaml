id: api-health
description: 5分ごとにヘルスエンドポイントを叩いてレスポンスを検証

trigger:
  source: cron
  schedule: "*/5 * * * *"

steps:
  - id: probe
    bash: |
      response=$(mktemp)
      trap 'rm -f "$response"' EXIT
      # --fail で 4xx/5xx を非0終了、--max-time で全体5秒打ち切り
      curl -fsS --max-time 5 https://example.com/health -o "$response"
      grep -q '"status":"ok"' "$response"
    timeout_sec: 10
    on_error: stop

  - id: notify_on_failure
    # 直前のステップが落ちたとき何をするかは on_error で制御。
    # ここでは現状の運用フックに合わせて差し替える前提でプレースホルダ。
    bash: |
      echo "fired_at: {{ event.timestamp }}"
    timeout_sec: 10
    on_error: continue
