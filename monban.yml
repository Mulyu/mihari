# 共通の security baseline は Mulyu/okite から継承する。
# baseline の中身: secret / conflict / invisible / injection 検出、GitHub Actions ハードニング、
#                  npm サプライチェーン対策、MCP 設定検査、.gitignore 対象の誤コミット検出。
extends:
  - type: github
    repo: Mulyu/okite
    ref: main
    path: monban.yml

doc:
  link:
    - path: "doc/**/*.md"
    - path: "*.md"

git:
  commit:
    message:
      subject_max_length: 72
      severity: warn
  diff:
    size:
      max_total_lines: 1500
      exclude:
        - "**/*.lock"
        - "**/package-lock.json"
        - "**/yarn.lock"
        - "**/pnpm-lock.yaml"
        - "**/__snapshots__/**"
      severity: warn
  branch_name:
    pattern: "^(main|claude/[A-Za-z0-9-]+)$"
    allowed: ["main"]
    severity: warn

agent:
  instructions:
    - path: "CLAUDE.md"
      required_sections:
        - "プロジェクト概要"
        - "設計原則"
        - "ディレクトリ構造"
        - "主要ライブラリ"
        - "コーディング規約"
        - "やらないこと（Non-Goals）"
      severity: warn
