extends:
  - type: github
    repo: Mulyu/okite
    ref: main
    path: monban.yml

doc:
  link:
    - path: "doc/**/*.md"
    - path: "README.md"
    - path: "README.ja.md"
    - path: "CLAUDE.md"

# src/ レイアウトを構造リンタで固定する。
# 8 つのトップレベルディレクトリ（agent/ cli/ engine/ lib/ loader/ state/ triggers/ types/）
# のみを src/ 直下に置く。直下に .ts ファイルは置かない（必ずディレクトリ配下）。
# 新規ディレクトリの追加が必要なら direction を更新してから入れる。
path:
  required:
    # ルートのメタデータ。揃っていないとリポジトリとして崩れている。
    - path: "."
      files:
        - "LICENSE"
        - "README.md"
        - "README.ja.md"
        - "CLAUDE.md"
        - "package.json"
        - "tsconfig.json"
        - "monban.yml"
    # src/ 直下は 8 ディレクトリのみ。直下ファイルは置かない。
    - path: "src"
      files:
        - "agent/"
        - "cli/"
        - "engine/"
        - "lib/"
        - "loader/"
        - "state/"
        - "triggers/"
        - "types/"
    # ユーザー向けドキュメントの日英ペア。
    - path: "doc"
      files:
        - "cli.md"
        - "cli.ja.md"
        - "runbook-spec.md"
        - "runbook-spec.ja.md"

  forbidden:
    # 旧構造への先祖返りを止める（PR #21 で恒久削除）。
    - path: "src/core/**"
      message: "src/core/ は engine/ lib/ loader/ state/ に分割されました。元に戻さない"
    - path: "src/pollers/**"
      message: "src/pollers/ は src/triggers/ にリネームされました（YAML の trigger.source と語彙を一致させる）"

    # direction: 「リポジトリ内に decisions ログは持たない」
    - path: "decisions.md"
      message: "decisions ログはリポジトリに置かない。判断は PR 説明と git log に残す"
    - path: "DECISIONS.md"
      message: "decisions ログはリポジトリに置かない。判断は PR 説明と git log に残す"
    - path: "doc/decisions/**"
      message: "decisions ログはリポジトリに置かない。判断は PR 説明と git log に残す"

    # src/ 直下のディレクトリは許可リスト方式で固定。
    - path: "src/!(agent|cli|engine|lib|loader|state|triggers|types)/"
      type: directory
      message: "src/ 直下のディレクトリは agent/ cli/ engine/ lib/ loader/ state/ triggers/ types/ のみ。新設は CLAUDE.md とこの allowlist の更新が前提"
    # src/ 直下に .ts ファイルを置かない。すべてサブディレクトリ配下に置く。
    - path: "src/*.ts"
      type: file
      message: "src/ 直下に .ts を置かない。cli/ types/ など意味のあるディレクトリ配下に置く"

    # コーディングエージェントが作りがちな曖昧ディレクトリを禁止。
    - path: "src/**/utils/**"
      message: "utils/ は禁止。意味のあるモジュール名に分類する"
    - path: "src/**/helpers/**"
      message: "helpers/ は禁止。意味のあるモジュール名に分類する"
    - path: "src/**/common/**"
      message: "common/ は禁止。意味のあるモジュール名に分類する"

    # src/ は TypeScript のみ（npm run build の出力 dist/ は .gitignore 済み）。
    - path: "src/**/*.js"
      message: "src/ は .ts のみ"
    - path: "src/**/*.jsx"
      message: "src/ は .ts のみ"

  naming:
    # 全ソースファイル・ディレクトリ名を kebab-case で統一（YAML 側の id 規約と揃える）。
    - path: "src/**/*.ts"
      style: kebab
    - path: "src/**/"
      target: directory
      style: kebab

  depth:
    # 今回の最深は src/loader/step-bash.ts で深さ 2。3 を上限にして余裕 1 だけ持たせる。
    # これ以上ネストしたくなったら大抵モジュール分割の合図。
    - path: "src"
      max: 3

  count:
    # examples は「bash で書けるなら新機能ではなくサンプルで提示する」ための受け皿。
    # 0 になっていたらそもそも direction の運用が崩れている合図。
    - path: "runbooks/examples"
      min: 1

git:
  commit:
    message:
      subject_max_length: 80
      severity: warn
  diff:
    size:
      max_total_lines: 1500
      exclude:
        - "**/*.lock"
        - "**/package-lock.json"
        - "**/yarn.lock"
        - "**/pnpm-lock.yaml"
        - "**/__snapshots__/**"
      severity: warn
  branch_name:
    pattern: "^(main|claude/[A-Za-z0-9-]+)$"
    allowed: ["main"]
    severity: error

agent:
  instructions:
    - path: "CLAUDE.md"
      required_sections:
        - "プロジェクト概要"
        - "設計原則"
        - "ディレクトリ構造"
        - "データフロー"
        - "失敗モードと対応"
        - "主要ライブラリ"
        - "コーディング規約"
        - "やらないこと（Non-Goals）"
      severity: error
