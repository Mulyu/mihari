id: lambda-error-alert
description: CloudWatch Logs の Lambda ERROR ログ 1 件ごとに 1 回通知（cooldown で抑制）

# AWS 認証は SDK 標準チェーン（環境変数 / ~/.aws/credentials / IAM ロール）に委譲。
# region と log_group は明示必須（state key の同一性を担保するため）。
trigger:
  source: cloudwatch_logs
  region: us-east-1
  log_group: /aws/lambda/myfunc
  pattern: "ERROR"
  interval_sec: 60

# 同じ問題が立て続けに来てもアラートを 5 分に 1 回までに絞る。
cooldown_sec: 300

steps:
  - id: notify
    bash: |
      # 値はクオートして渡す（IFS 分割を避ける）。
      curl -fsS -X POST -H 'Content-Type: application/json' \
        -d "{\"text\":\"Lambda error in {{ event.path }} ({{ event.log_stream }}): {{ event.line }}\"}" \
        "$SLACK_WEBHOOK_URL"
    env:
      # 通知先 webhook は実運用では env から差し込む。
      SLACK_WEBHOOK_URL: https://hooks.slack.com/services/REPLACE/ME
    timeout_sec: 10
    on_error: continue
